# Draft ESP-Brookesia 0.7 board package, reconstructed from FactoryApp V1.1
# and the public Waveshare BSP.  Not build-tested yet; see README.md.
devices:
  # CH32V003 I2C GPIO expander at 0x24.
  # Pin 0 = LCD/touch reset, pin 1 = LCD reset, pin 3 = power amplifier enable.
  # The same chip also owns the LCD backlight PWM register (0x05).
  - name: gpio_expander
    chip: ch32v003
    type: gpio_expander
    version: default
    dependencies:
      custom_io_expander_ch32v003:
        override_path: "${BOARD_PATH}/components/custom_io_expander_ch32v003"
    config:
      max_pins: 8
      output_io_mask: [0, 1, 3]
      output_io_level_mask: [1, 1, 1]
      input_io_mask: NULL
    peripherals:
      - name: i2c_master
        i2c_addr: [0x24]

  - name: audio_dac
    chip: es8311
    type: audio_codec
    depends_on: gpio_expander
    version: default
    config:
      adc_enabled: false
      dac_enabled: true
      dac_max_channel: 1
      dac_channel_mask: "1"
      dac_init_gain: 0
      mclk_enabled: false
    peripherals:
      - name: i2s_audio_out
      - name: i2c_master
        address: 0x30
        frequency: 400000

  - name: audio_adc
    chip: es8311
    type: audio_codec
    depends_on: gpio_expander
    version: default
    config:
      adc_enabled: true
      adc_max_channel: 1
      adc_channel_mask: "1"
      adc_channel_labels: ["M"]
      adc_init_gain: 30
    peripherals:
      - name: i2s_audio_in
      - name: i2c_master
        address: 0x30
        frequency: 400000

  - name: display_lcd
    chip: st7789
    type: display_lcd
    depends_on: gpio_expander
    sub_type: spi
    version: default
    dependencies:
      espressif/esp_lcd_st7789: "^2"
    config:
      invert_color: true
      need_reset: false
      mirror_x: false
      mirror_y: false
      swap_xy: false
      x_max: 240
      y_max: 320
      io_spi_config:
        cs_gpio_num: 10
        dc_gpio_num: 9
        spi_mode: 0
        # ota_0 CustomBoard uses 40 MHz; factory/public BSP use 80 MHz.
        # Start bring-up at 40 MHz and validate 80 MHz on hardware.
        pclk_hz: 40000000
        trans_queue_depth: 10
        lcd_cmd_bits: 8
        lcd_param_bits: 8
        flags:
          sio_mode: false
      lcd_panel_config:
        reset_gpio_num: -1
        rgb_ele_order: "LCD_RGB_ELEMENT_ORDER_RGB"
        bits_per_pixel: 16
        vendor_config: NULL
    peripherals:
      - name: spi_display

  - name: lcd_touch
    chip: cst3530
    type: lcd_touch
    depends_on: gpio_expander
    sub_type: i2c
    version: default
    dependencies:
      espressif/esp_lcd_touch:
        version: "*"
        require: public
      esp_lcd_touch_cst3530:
        override_path: "${BOARD_PATH}/components/esp_lcd_touch_cst3530"
    config:
      io_i2c_config:
        dev_addr: 0x58
        control_phase_bytes: 1
        dc_bit_offset: 0
        lcd_cmd_bits: 32
        lcd_param_bits: 8
        scl_speed_hz: 400000
        flags:
          dc_low_on_data: false
          disable_control_phase: true
      touch_config:
        x_max: 240
        y_max: 320
        rst_gpio_num: -1
        int_gpio_num: 5
        levels:
          reset: 0
          interrupt: 0
        flags:
          swap_xy: false
          mirror_x: false
          mirror_y: false
    peripherals:
      - name: i2c_master
        i2c_addr: [0x58]

  # No lcd_brightness device: the backlight is CH32V003 PWM register 0x05,
  # not an ESP32 LEDC GPIO.  A custom display/backlight HAL implementation is
  # required for runtime brightness control; see README.md.
