name: G-V1 T1 MIC final print files

on:
  push:
    branches:
      - codex/gv1-t1-final-mic-hole-20261020
    paths:
      - .github/workflows/gv1-t1-final-print.yml
      - scripts/finalize-g-v1-t1-print.py
      - deliverables/g-v1-t1-final/README.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-t1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout T1 source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenCascade validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery-ocp-novtk trimesh==4.11.1
      - name: Cut MIC opening and validate final STEP and STL
        run: python scripts/finalize-g-v1-t1-print.py
      - name: Publish verified T1 print ZIP
        uses: actions/upload-artifact@v4
        with:
          name: G-V1-95p60-T1-MIC1p5-PRINT-FILES
          path: |
            deliverables/g-v1-t1-final/*.step
            deliverables/g-v1-t1-final/*.stl
            deliverables/g-v1-t1-final/*.json
            deliverables/g-v1-t1-final/*.zip
          if-no-files-found: error
          retention-days: 90
      - name: Commit final print files to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/g-v1-t1-final/*.step deliverables/g-v1-t1-final/*.stl deliverables/g-v1-t1-final/*.json deliverables/g-v1-t1-final/*.zip
          if ! git diff --cached --quiet; then
            git commit -m "cad: export verified T1 front MIC bore and unchanged rear shell"
            git push
          fi
